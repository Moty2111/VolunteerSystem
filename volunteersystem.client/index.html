<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VolunteerSystem — платформа координации волонтёров, мероприятий и партнёрских программ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>VolunteerSystem — помощь рядом</title>
    <script>
      // Тема применяется до первой отрисовки — интерфейс не мигает
      try {
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved || 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
